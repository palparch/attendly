{% extends "base.html" %}
{% block title %}Login · Attendly{% endblock %}
{% block content %}
<section class="panel narrow">
    <h1>Welcome back</h1>
    <p class="muted">Sign in to your Attendly account.</p>
    <form method="post">
        <label>Username
            <input name="username" autocomplete="username" required>
        </label>
        <label>Password
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Log in</button>
    </form>
    <p class="muted small">Student accounts are created by the class teacher.</p>
</section>
{% endblock %}
